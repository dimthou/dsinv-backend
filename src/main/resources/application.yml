spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dsinv_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # use 'update' temporarily if schema is empty
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # flyway:
  #   enabled: true
  #   locations: classpath:db/migration
